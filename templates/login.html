<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank & DSA Connect Portal</title>

<style>

body{
background:#f4f7fb;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
width:350px;
}

h1{
text-align:center;
color:#0d47a1;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#0d47a1;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1565c0;
}

</style>

</head>

<body>

<div class="card">

<h1>Bank & DSA Connect Portal</h1>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

<p style="text-align:center;margin-top:15px;">
    New DSA?
    <a href="/dsa/register">Register Here</a>
</p>

<p style="text-align:center;">
    Bank Employee?
    <a href="/bank/register">Register Here</a>
</p>

<p style="text-align:center;">
    Customer?
    <a href="/customer">Search Portal</a>
</p>

</form>

</div>

</body>
</html>
