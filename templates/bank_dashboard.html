<!DOCTYPE html>
<html>
<head>
<title>Bank Employee Dashboard</title>

<style>
body{
font-family:Arial;
background:#eef4ff;
margin:40px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
max-width:700px;
margin:auto;
}

.box{
background:#f5f7ff;
padding:15px;
margin:15px 0;
border-left:5px solid #0d47a1;
}

.logout{
display:inline-block;
padding:10px 18px;
background:#d32f2f;
color:white;
text-decoration:none;
border-radius:5px;
}
</style>

</head>

<body>

<div class="card">

<h1>Bank Employee Dashboard</h1>

<div class="box"><b>Name:</b> {{ user.name }}</div>
<div class="box"><b>Email:</b> {{ user.email }}</div>
<div class="box"><b>Role:</b> {{ user.role }}</div>
<div class="box"><b>Status:</b> {{ user.status }}</div>

<a href="/" class="logout">Logout</a>

</div>

</body>
</html>
